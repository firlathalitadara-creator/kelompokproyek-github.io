```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Data Absensi Siswa</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255,255,255,.08) 0 70px,
                    transparent 71px
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(255,255,255,.06) 0 100px,
                    transparent 101px
                ),

                linear-gradient(
                    135deg,
                    #071b33,
                    #123b61,
                    #071b33
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px 15px;

        }


        .card {

            width: 480px;

            max-width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #fffdf7,
                    #f4eee0
                );

            border-radius: 32px;

            padding: 28px;

            box-shadow:
                0 25px 60px rgba(0,0,0,.35);

        }


        .header {

            text-align: center;

            margin-bottom: 22px;

        }


        .logo {

            width: 65px;

            height: 65px;

            margin: auto;

            background: #173b5f;

            border-radius: 20px;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            font-weight: bold;

        }


        h1 {

            color: #173b5f;

            margin-top: 13px;

            font-size: 23px;

        }


        .subtitle {

            color: #7a8792;

            font-size: 12px;

            margin-top: 5px;

        }


        .profile {

            background: white;

            border-radius: 22px;

            padding: 17px;

            display: flex;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 8px 20px rgba(0,0,0,.08);

        }


        .photo {

            width: 80px;

            height: 80px;

            min-width: 80px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #173b5f;

        }


        .profile h2 {

            color: #173b5f;

            font-size: 17px;

            margin-bottom: 6px;

        }


        .profile p {

            color: #7a8792;

            font-size: 11px;

            margin: 3px 0;

        }


        .data {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 15px;

        }


        .box {

            background: white;

            border-radius: 15px;

            padding: 13px;

        }


        .box span {

            display: block;

            color: #89939c;

            font-size: 9px;

            margin-bottom: 5px;

        }


        .box strong {

            color: #173b5f;

            font-size: 12px;

        }


        .status {

            margin-top: 10px;

            background: #173b5f;

            color: white;

            border-radius: 16px;

            padding: 14px;

            text-align: center;

        }


        .status span {

            display: block;

            font-size: 9px;

            opacity: .7;

            margin-bottom: 4px;

        }


        .status strong {

            font-size: 15px;

        }


        .back {

            display: block;

            text-decoration: none;

            text-align: center;

            background: #173b5f;

            color: white;

            padding: 13px;

            border-radius: 50px;

            margin-top: 18px;

            font-size: 12px;

            font-weight: bold;

        }


        .footer {

            text-align: center;

            color: #89939c;

            font-size: 9px;

            margin-top: 18px;

        }

    </style>

</head>


<body>


<div class="card">


    <div class="header">

        <div class="logo">
            ✓
        </div>


        <h1>
            Data Absensi Siswa
        </h1>


        <p class="subtitle">
            Data berhasil dibaca dari QR
        </p>

    </div>


    <!-- FOTO + NAMA -->

    <div class="profile">

        <img
            src="img/foto-siswa.jpg"
            class="photo"
            alt="Foto Siswa"
        >


        <div>

            <h2 id="nama">
                -
            </h2>


            <p>
                <b>No. Kartu:</b>
                <span id="kartu">-</span>
            </p>


            <p>
                <b>Kelas:</b>
                <span id="kelas">-</span>
            </p>

        </div>

    </div>


    <!-- DATA -->

    <div class="data">

        <div class="box">

            <span>
                JURUSAN
            </span>

            <strong id="jurusan">
                -
            </strong>

        </div>


        <div class="box">

            <span>
                NO. URUT
            </span>

            <strong id="urut">
                -
            </strong>

        </div>


        <div class="box">

            <span>
                TANGGAL
            </span>

            <strong id="tanggal">
                -
            </strong>

        </div>


        <div class="box">

            <span>
                JAM TAP
            </span>

            <strong id="waktu">
                -
            </strong>

        </div>

    </div>


    <!-- STATUS -->

    <div class="status">

        <span>
            STATUS KEHADIRAN
        </span>

        <strong id="status">
            ✓ HADIR
        </strong>

    </div>


    <a
        href="index.html"
        class="back"
    >
        Kembali ke Absensi
    </a>


    <div class="footer">
        Sistem Absensi RFID • XI RPL
    </div>


</div>


<script>

    // Ambil data dari QR
    const params =
        new URLSearchParams(
            window.location.search
        );


    document.getElementById("nama").textContent =
        params.get("nama") || "-";


    document.getElementById("kartu").textContent =
        params.get("kartu") || "-";


    document.getElementById("kelas").textContent =
        params.get("kelas") || "-";


    document.getElementById("jurusan").textContent =
        params.get("jurusan") || "-";


    document.getElementById("urut").textContent =
        params.get("urut") || "-";


    document.getElementById("tanggal").textContent =
        params.get("tanggal") || "-";


    document.getElementById("waktu").textContent =
        params.get("waktu") || "-";


    document.getElementById("status").textContent =
        "✓ " +
        (params.get("status") || "HADIR");

</script>


</body>

</html>
```
